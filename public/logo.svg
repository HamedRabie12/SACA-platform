<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">SACA — Sudanese American Community Association</title>
  <desc id="desc">Modern SACA identity with Sudan and United States flags representing community, service and connection.</desc>
  <defs>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#062F2A"/>
      <stop offset="55%" stop-color="#0C5747"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2D48A"/>
      <stop offset="100%" stop-color="#B98A3F"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#061D1A" flood-opacity=".22"/>
    </filter>
    <clipPath id="circleClip"><circle cx="128" cy="128" r="104"/></clipPath>
    <clipPath id="sudanClip"><rect x="48" y="43" width="78" height="52" rx="10"/></clipPath>
    <clipPath id="usClip"><rect x="130" y="43" width="78" height="52" rx="10"/></clipPath>
  </defs>

  <!-- Emblem -->
  <g filter="url(#softShadow)">
    <circle cx="128" cy="128" r="108" fill="#fff"/>
    <circle cx="128" cy="128" r="104" fill="url(#emerald)"/>
    <circle cx="128" cy="128" r="94" fill="none" stroke="url(#gold)" stroke-width="4"/>

    <!-- Sudan flag badge -->
    <g clip-path="url(#sudanClip)">
      <rect x="48" y="43" width="78" height="17.34" fill="#D1121D"/>
      <rect x="48" y="60.34" width="78" height="17.34" fill="#FFFFFF"/>
      <rect x="48" y="77.68" width="78" height="17.32" fill="#111111"/>
      <path d="M48 43 L82 69 L48 95 Z" fill="#178C43"/>
    </g>
    <rect x="48" y="43" width="78" height="52" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity=".42" stroke-width="2"/>

    <!-- United States flag badge -->
    <g clip-path="url(#usClip)">
      <rect x="130" y="43" width="78" height="52" fill="#fff"/>
      <g fill="#C92032">
        <rect x="130" y="43" width="78" height="4"/>
        <rect x="130" y="51" width="78" height="4"/>
        <rect x="130" y="59" width="78" height="4"/>
        <rect x="130" y="67" width="78" height="4"/>
        <rect x="130" y="75" width="78" height="4"/>
        <rect x="130" y="83" width="78" height="4"/>
        <rect x="130" y="91" width="78" height="4"/>
      </g>
      <rect x="130" y="43" width="32" height="24" fill="#244A9B"/>
      <g fill="#fff" opacity=".95">
        <circle cx="136" cy="48" r="1.2"/><circle cx="143" cy="48" r="1.2"/><circle cx="150" cy="48" r="1.2"/><circle cx="157" cy="48" r="1.2"/>
        <circle cx="139.5" cy="54" r="1.2"/><circle cx="146.5" cy="54" r="1.2"/><circle cx="153.5" cy="54" r="1.2"/>
        <circle cx="136" cy="60" r="1.2"/><circle cx="143" cy="60" r="1.2"/><circle cx="150" cy="60" r="1.2"/><circle cx="157" cy="60" r="1.2"/>
      </g>
    </g>
    <rect x="130" y="43" width="78" height="52" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity=".42" stroke-width="2"/>

    <!-- People / community -->
    <circle cx="102" cy="126" r="15" fill="#fff"/>
    <circle cx="128" cy="116" r="19" fill="#fff"/>
    <circle cx="154" cy="126" r="15" fill="#fff"/>
    <path d="M76 168c7-26 24-38 52-38s45 12 52 38" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
    <path d="M104 166c16-12 32-12 48 0" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>

    <!-- Bridge / connection -->
    <path d="M71 181 Q128 218 185 181" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="128" cy="30" r="7" fill="#F2D48A"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(270 64)">
    <text x="0" y="84" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="4" fill="#0B3D34">SACA</text>
    <rect x="3" y="101" width="360" height="5" rx="2.5" fill="url(#gold)"/>
    <text x="2" y="136" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="1.3" fill="#4D554F">SUDANESE AMERICAN COMMUNITY ASSOCIATION</text>
    <text x="0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#726B60">Community • Service • Governance • Belonging</text>
  </g>
</svg>
